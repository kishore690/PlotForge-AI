# =========================================================
# PlotForge Backend - Development Profile
# =========================================================

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/plotforge_dev
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.plotforge: DEBUG
