# =========================================================
# PlotForge Backend - Production Profile
# All secrets are supplied via environment variables.
# =========================================================

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.plotforge: INFO
